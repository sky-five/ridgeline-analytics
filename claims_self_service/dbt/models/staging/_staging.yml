version: 2
models:
  - name: stg_claims__policies
    columns:
      - name: policy_id
        data_tests: [unique, not_null]
      - name: line_of_business
        data_tests: [{accepted_values: {arguments: {values: [personal_auto, homeowners, commercial_property]}}}]
  - name: stg_claims__perils
    columns:
      - name: peril_id
        data_tests: [unique, not_null]
  - name: stg_claims__claims
    columns:
      - name: claim_id
        data_tests: [unique, not_null]
      - name: policy_id
        data_tests: [not_null, {relationships: {arguments: {to: ref('stg_claims__policies'), field: policy_id}}}]
      - name: peril_id
        data_tests: [not_null, {relationships: {arguments: {to: ref('stg_claims__perils'), field: peril_id}}}]
      - name: status
        data_tests: [{accepted_values: {arguments: {values: [open, approved, denied, withdrawn]}}}]
