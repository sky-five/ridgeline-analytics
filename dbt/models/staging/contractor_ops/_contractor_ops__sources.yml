version: 2
sources:
  - name: contractor_ops
    description: Contractors' own homeowner leads and jobs tracked in Ridgeline (simulated).
    database: "{{ 'RIDGELINE_RAW' if target.type == 'snowflake' else target.database }}"
    schema: raw_contractor_ops
    config:
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
      # freshness = when the pipeline last loaded successfully, not business activity:
      # sparse tables (e.g. CRM deals) can go days without new rows.
      loaded_at_query: "select max(inserted_at) from {{ 'RIDGELINE_RAW' if target.type == 'snowflake' else target.database }}.raw_contractor_ops._dlt_loads where status = 0"
    tables:
      - name: contractor_leads
