version: 2

unit_tests:
  - name: first14d_stops_at_first_payment
    description: >
      Early signals must be pre-purchase behaviour. Activity after an account pays (paid-plan usage)
      would leak the outcome into the score, so the window ends at the first payment if that comes first.
    model: int_account_first14d
    given:
      - input: ref('stg_app_db__accounts')
        rows:
          - {account_id: a, signup_at: "2026-01-01 00:00:00"}
          - {account_id: b, signup_at: "2026-01-01 00:00:00"}
      - input: ref('stg_app_db__subscription_changes')
        rows:
          - {account_id: a, change_type: new, changed_at: "2026-01-05 00:00:00"}
      - input: ref('stg_product_events__events')
        rows:
          - {account_id: a, event_type: login, occurred_at: "2026-01-03 00:00:00"}
          - {account_id: a, event_type: login, occurred_at: "2026-01-08 00:00:00"}
          - {account_id: a, event_type: proposal_sent, occurred_at: "2026-01-06 00:00:00"}
          - {account_id: b, event_type: login, occurred_at: "2026-01-03 00:00:00"}
          - {account_id: b, event_type: login, occurred_at: "2026-01-08 00:00:00"}
          - {account_id: b, event_type: proposal_sent, occurred_at: "2026-01-06 00:00:00"}
    expect:
      rows:
        - {account_id: a, logins_14d: 1, proposals_14d: 0, proposal_wk1: false}
        - {account_id: b, logins_14d: 2, proposals_14d: 1, proposal_wk1: true}
