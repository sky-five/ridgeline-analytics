version: 2

models:
  - name: fct_mrr_movements
    description: One row per subscription change that moved MRR, classified as a movement type.
    config:
      contract: {enforced: true}
    columns:
      - name: change_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [unique]
      - name: account_id
        data_type: varchar
      - name: changed_at
        data_type: timestamp
      - name: movement_date
        data_type: date
      - name: movement_month
        data_type: date
      - name: movement_type
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments: {values: [new, expansion, contraction, churn, reactivation]}
      - name: mrr_before
        data_type: numeric(28,6)
      - name: mrr_after
        data_type: numeric(28,6)
      - name: mrr_delta
        data_type: numeric(28,6)

  - name: fct_mrr_daily
    description: Company MRR and its movements for every day from history start to the as-of date.
    config:
      contract: {enforced: true}
    columns:
      - name: date_day
        data_type: date
        constraints: [{type: not_null}]
        data_tests: [unique]
      - name: mrr
        data_type: numeric(28,6)
      - name: paying_accounts
        data_type: bigint
      - name: new_mrr
        data_type: numeric(28,6)
      - name: expansion_mrr
        data_type: numeric(28,6)
      - name: contraction_mrr
        data_type: numeric(28,6)
      - name: churned_mrr
        data_type: numeric(28,6)
      - name: reactivation_mrr
        data_type: numeric(28,6)
      - name: net_new_mrr
        data_type: numeric(28,6)

  - name: dim_accounts
    description: One row per contractor account with its current commercial state.
    config:
      contract: {enforced: true}
    columns:
      - name: account_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [unique]
      - name: company_name
        data_type: varchar
      - name: signup_at
        data_type: timestamp
      - name: signup_month
        data_type: date
      - name: channel
        data_type: varchar
      - name: campaign_id
        data_type: varchar
      - name: region
        data_type: varchar
      - name: crew_size
        data_type: varchar
      - name: first_paid_at
        data_type: timestamp
      - name: current_plan
        data_type: varchar
      - name: current_addons
        data_type: varchar
      - name: current_mrr
        data_type: numeric(28,6)
      - name: is_paying
        data_type: boolean
      - name: churned_at
        data_type: timestamp
      - name: cancel_reason
        data_type: varchar

unit_tests:
  - name: mrr_movements_types
    description: Each kind of MRR change maps to the right movement type.
    model: int_mrr_movements
    given:
      - input: ref('stg_app_db__subscription_changes')
        rows:
          - {change_id: c1, account_id: a, changed_at: "2025-01-05 10:00:00", change_type: new, mrr_before: 0, mrr_after: 249}
          - {change_id: c2, account_id: a, changed_at: "2025-02-05 10:00:00", change_type: upgrade, mrr_before: 249, mrr_after: 349}
          - {change_id: c3, account_id: a, changed_at: "2025-03-05 10:00:00", change_type: downgrade, mrr_before: 349, mrr_after: 298}
          - {change_id: c4, account_id: a, changed_at: "2025-04-05 10:00:00", change_type: cancel, mrr_before: 298, mrr_after: 0}
          - {change_id: c5, account_id: a, changed_at: "2025-06-05 10:00:00", change_type: reactivate, mrr_before: 0, mrr_after: 249}
    expect:
      rows:
        - {change_id: c1, movement_type: new, mrr_delta: 249}
        - {change_id: c2, movement_type: expansion, mrr_delta: 100}
        - {change_id: c3, movement_type: contraction, mrr_delta: -51}
        - {change_id: c4, movement_type: churn, mrr_delta: -298}
        - {change_id: c5, movement_type: reactivation, mrr_delta: 249}

  - name: mrr_movements_month_boundary
    description: Changes in the last second of a month stay in that month.
    model: int_mrr_movements
    given:
      - input: ref('stg_app_db__subscription_changes')
        rows:
          - {change_id: c1, account_id: a, changed_at: "2025-01-31 23:59:59", change_type: new, mrr_before: 0, mrr_after: 249}
          - {change_id: c2, account_id: b, changed_at: "2025-02-01 00:00:00", change_type: new, mrr_before: 0, mrr_after: 249}
    expect:
      rows:
        - {change_id: c1, movement_month: "2025-01-01"}
        - {change_id: c2, movement_month: "2025-02-01"}
