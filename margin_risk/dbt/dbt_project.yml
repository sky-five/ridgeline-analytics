name: margin_risk
version: "1.0.0"
profile: margin_risk
config-version: 2

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target"]

models:
  margin_risk:
    staging:
      +materialized: view
    marts:
      +materialized: table

vars:
  initial_rate: 0.50  # a purchase may borrow at most half its value (margin_risk/simulate.py INITIAL_RATE)
  concentration_share: 0.50  # a holding over this share of the account's market value ...
  concentration_rate: 0.40  # ... needs at least this maintenance rate
  recon_tolerance: 1.00  # dollars; an account-day differing from the ledger by this much or more is a break
