config-version: 2

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target"]

models:
  lead_cost:
    silver:
      +materialized: table
    gold:
      +materialized: table

vars:
  first_day: "2026-04-01"  # first day of the exports (lead_cost/simulate.py)
  as_of: "2026-06-30"  # last day of data
  min_click_id_match: 0.98  # share of CRM click ids a week that must match a click the ad platforms sent
