name: nightly

# Simulates the new day, loads it into the warehouse incrementally, rebuilds the dbt models and publishes
# the Evidence site to GitHub Pages. If any step fails, Pages keeps serving the last good build.
# The warehouse and dlt state carry over between runs in the Actions cache; once a week (Sunday's scheduled
# run, or a manual run with full_check) a second warehouse is rebuilt from scratch and must match it.
on:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_check:
        description: "Also rebuild from scratch and check it matches the incremental warehouse"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RIDGELINE_DUCKDB_PATH: ${{ github.workspace }}/warehouse/ridgeline.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          uv venv .venv
          uv pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "AS_OF=$(date -u -d yesterday +%F)" >> "$GITHUB_ENV"

      - name: Day of the week (7 is Sunday, the weekly full check)
        id: day
        run: echo "weekday=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      - name: Cache simulated history
        uses: actions/cache@v4
        with:
          path: .cache
          key: sim-${{ hashFiles('requirements.txt') }}

      - name: Month-end close as of the same date (revrec parallel run)
        run: python -m revrec --as-of "$AS_OF"

      # Yesterday's warehouse and dlt cursors. The key changes with the engine pin or the pipeline code,
      # and then the run starts from scratch.
      - name: Restore warehouse and pipeline state
        id: warehouse
        uses: actions/cache/restore@v4
        with:
          path: |
            warehouse
            .dlt_pipelines
          key: warehouse-${{ hashFiles('requirements.txt', 'pipelines/**') }}-${{ github.run_id }}
          restore-keys: warehouse-${{ hashFiles('requirements.txt', 'pipelines/**') }}-

      - name: Load (incremental) + dbt build
        run: python scripts/run_all.py --as-of "$AS_OF"

      - name: Every governed metric matches its independent check, month by month
        run: python -m metric_glossary

      - name: Source freshness
        working-directory: dbt
        run: |
          dbt source freshness --profiles-dir . --vars "{as_of_date: '$AS_OF'}"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reports/package-lock.json

      - name: Build Evidence site
        working-directory: reports
        run: |
          sed -i "s#basePath: ''#basePath: '/${{ github.event.repository.name }}'#" evidence.config.yaml
          npm ci
          npm run sources
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports/build

      # Only when the warehouse was built on top of an earlier one: a run without a cache hit is already
      # a full rebuild. A mismatch fails the run, so the site is not deployed and the state is not saved.
      - name: Weekly check, a rebuild from scratch gives the same warehouse
        if: >-
          steps.warehouse.outputs.cache-matched-key != '' &&
          (inputs.full_check || (github.event_name == 'schedule' && steps.day.outputs.weekday == '7'))
        run: |
          python scripts/run_all.py --fresh --as-of "$AS_OF" \
            --warehouse warehouse_full/ridgeline.duckdb --dlt-dir .dlt_pipelines_full
          python -m pipelines.parity warehouse/ridgeline.duckdb warehouse_full/ridgeline.duckdb

      - name: Save warehouse and pipeline state for tomorrow
        uses: actions/cache/save@v4
        with:
          path: |
            warehouse
            .dlt_pipelines
          key: warehouse-${{ hashFiles('requirements.txt', 'pipelines/**') }}-${{ github.run_id }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          for page in "" acquisition/ sales/ data-health/ metrics/ experiments/ renewals-at-risk/ account-reviews/ account-reviews/opportunities/ raw-vs-governed/ ask-the-funnel/ arr-walk/ vehicle-auction/ report-reconciliation/ quote-funnel/ or-utilisation/ claims-self-service/ onboarding-funnel/ ed-wait-times/ enrolment-planning/ margin-risk/ book-health/ ops-daily/ lead-cost/; do
            curl -fsS -o /dev/null "${base}${page}" && echo "ok ${base}${page}"
          done
          # one page rendered from the account review template
          review=$(curl -fsS "${base}account-reviews/" | grep -o 'account-reviews/ACC-[0-9]*' | head -1)
          test -n "$review" && curl -fsS -o /dev/null "${base}${review}/" && echo "ok ${base}${review}/"

  # Migration kit parallel run: today's earthquake feed through the full reload and the incremental merge,
  # on top of the committed snapshots. Separate from the site build so a feed outage cannot block Pages.
  migration-parallel-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          uv venv .venv
          uv pip install duckdb==1.5.6
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Today's feed reconciles between the legacy and target tables
        run: python -m migration_kit --live
