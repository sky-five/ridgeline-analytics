name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RIDGELINE_DUCKDB_PATH: ${{ github.workspace }}/warehouse/ridgeline.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          uv venv .venv
          uv pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache simulated history
        uses: actions/cache@v4
        with:
          path: .cache
          key: sim-${{ hashFiles('requirements.txt') }}

      - name: Lint Python
        run: ruff check .

      - name: Unit tests
        run: pytest -m "not e2e" -q

      - name: Pick as-of date (yesterday, UTC)
        run: echo "AS_OF=$(date -u -d yesterday +%F)" >> "$GITHUB_ENV"

      - name: Product events meet their contract (yesterday's batch)
        run: python -m data_health --day "$AS_OF"

      - name: No source table graded red (yesterday's batches)
        run: python -m data_health.scorecard --day "$AS_OF"

      - name: Month-end close as of the same date (revrec parallel run)
        run: python -m revrec --as-of "$AS_OF"

      - name: Load + dbt build
        run: python scripts/run_all.py --fresh --as-of "$AS_OF"

      - name: Governed metrics agree with the marts
        run: pytest -m warehouse -q

      - name: Source freshness
        working-directory: dbt
        run: |
          dbt source freshness --profiles-dir . --vars "{as_of_date: '$AS_OF'}"

      - name: Lint SQL
        working-directory: dbt
        run: sqlfluff lint models

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt/target/manifest.json
            dbt/target/run_results.json
            dbt/target/sources.json

  # Governed metrics on a fixed snapshot: a PR that moves a metric's value must bump its version.
  metric-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RIDGELINE_DUCKDB_PATH: ${{ github.workspace }}/warehouse/ridgeline.duckdb
      RIDGELINE_AS_OF: "2026-06-30"  # the contract's snapshot; never moves with the calendar
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          uv venv .venv
          uv pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache simulated history
        uses: actions/cache@v4
        with:
          path: .cache
          key: sim-${{ hashFiles('requirements.txt') }}

      - name: Base branch's contract
        run: |
          git fetch --depth 1 origin "${{ github.base_ref || 'main' }}"
          git show FETCH_HEAD:metric_contract/contract.json > "$RUNNER_TEMP/base-contract.json" || true

      - name: Build the warehouse on the fixed snapshot
        run: python scripts/run_all.py --fresh --as-of "$RIDGELINE_AS_OF"

      - name: Governed metrics keep their values unless their version is bumped
        run: python -m metric_contract --base "$RUNNER_TEMP/base-contract.json"

      - name: Channel CAC and budget what-if results match the snapshot
        run: python -m acquisition_spend --check

      - name: Outbound notes match the snapshot and recorded drafts replay
        run: python -m outbound_notes --check
